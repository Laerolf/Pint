[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "square-api-client", "migration", "domain", "entity", "infrastructure", "api"]

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "query"] }
sea-orm = { version = "^2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "mock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
utoipa = { version = "5.5.0", features = ["macros"] }
tokio = { version = "1.53.1", features = ["macros"] }

[dependencies]
api = { path = "api" }
tokio = { workspace = true }
