name: local-test

services:
  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    env_file:
      - .env.test
    ports:
      - "5432:5432"

  cloudbeaver:
    image: dbeaver/cloudbeaver:26
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  cloudbeaver_data:
